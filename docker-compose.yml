version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MAINLAYER_API_KEY=${MAINLAYER_API_KEY}
      - MAINLAYER_BASE_URL=${MAINLAYER_BASE_URL:-https://api.mainlayer.fr}
      - ENV=${ENV:-production}
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
